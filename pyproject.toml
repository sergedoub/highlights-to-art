[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "highlights-to-art"
version = "0.1.0"
description = "Turn Kindle highlights into illustrated e-ink artwork with configurable image providers."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
highlight-art = "highlight_art.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/highlight_art"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.hatch.build.targets.sdist]
include = ["src", "tests", "bin", "kindle", "launchd", "prompts", "docs", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "pyproject.toml", "uv.lock", "config.example.toml", ".env.example"]
